[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouseclicker"
version = "0.1.0"
description = "A simple, lightweight mouse auto-clicker for Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "pyyaml>=6.0",
    "evdev>=1.7",
    "croniter>=2.0",
    "qdarkstyle>=3.2",
]

[project.scripts]
mouseclicker = "mouseclicker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
